
name: Build Qmax Sale debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'QmaxSale-Android-Source.zip'
      - '.github/workflows/android-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -o QmaxSale-Android-Source.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/QmaxSale
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QmaxSale-debug-apk
          path: extracted/QmaxSale/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

